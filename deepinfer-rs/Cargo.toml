[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/idrees2516/deepinfer-rs"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"

[workspace.lints.clippy]
# Kernel launchers and reference kernels intentionally mirror the vendor C
# signatures (one parameter per kernel argument) — readability over arity.
too_many_arguments = "allow"
# Index loops document the exact iteration order that the determinism
# contracts rely on; rewriting them into iterators hides that.
needless_range_loop = "allow"

[workspace.dependencies]
deepinfer-core = { path = "crates/core" }
deepinfer-fp8 = { path = "crates/fp8" }
deepinfer-gemm = { path = "crates/gemm" }
deepinfer-mla = { path = "crates/mla" }
deepinfer-dsa = { path = "crates/dsa" }
deepinfer-swa = { path = "crates/swa" }
deepinfer-moe = { path = "crates/moe" }
deepinfer-mtp = { path = "crates/mtp" }
deepinfer-sampler = { path = "crates/sampler" }
deepinfer-grammar = { path = "crates/grammar" }
deepinfer-scheduler = { path = "crates/scheduler" }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
